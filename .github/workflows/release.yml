name: 'release'

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          version: "latest"

      - name: Check release version and changelog
        run: uv run --no-project scripts/check_release_tag.py "${{ github.ref_name }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --draft --title "Quiver ${{ github.ref_name }}" --notes-file "changelog/${{ github.ref_name }}.md"
          fi

  publish-archives:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin

          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin

          - name: Linux x64 GNU
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: Linux arm64 GNU
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          version: "latest"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            yt-dlp/pyproject.toml
            yt-dlp/bundle/requirements/*.txt

      - name: Install Rust toolchain and targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install Minisign-compatible signing tool
        run: cargo binstall rsign2@0.6.6 --no-confirm

      - name: Install .NET SDK
        if: ${{ !(matrix.name == 'Windows x64' || matrix.name == 'Windows arm64') }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install native build dependencies (Linux only)
        if: ${{ matrix.name == 'Linux x64 GNU' || matrix.name == 'Linux arm64 GNU' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl libssl-dev pkg-config

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} --bins

      - name: Test release binaries
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Assemble release archive
        run: uv run --no-project scripts/package_release.py --target ${{ matrix.target }}

      - name: Sign and verify release archive
        shell: pwsh
        env:
          QUIVER_MINISIGN_SECRET_KEY: ${{ secrets.QUIVER_MINISIGN_SECRET_KEY }}
        run: |
          $archive = (Get-ChildItem dist -Filter "quiver-*-${{ matrix.target }}.txz" | Select-Object -First 1).FullName
          if (-not $archive) { throw "Missing release archive" }
          uv run --no-project scripts/sign_release.py --archive $archive
          uv run --no-project scripts/verify_binstall.py --archive $archive --target ${{ matrix.target }}

      - name: Upload signed archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = (Get-ChildItem dist -Filter "quiver-*-${{ matrix.target }}.txz" | Select-Object -First 1).FullName
          if (-not $archive) { throw "Missing release archive" }
          gh release upload "${{ github.ref_name }}" $archive "$archive.sig" --clobber
