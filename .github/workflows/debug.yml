name: 'debug'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc

          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin

          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin

          - name: Linux x64 GNU
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - name: Linux arm64 GNU
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          version: "latest"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            yt-dlp/pyproject.toml
            yt-dlp/bundle/requirements/*.txt

      - name: Install Rust toolchain and targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install .NET SDK
        if: ${{ !(matrix.name == 'Windows x64' || matrix.name == 'Windows arm64') }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: install dependencies (Linux only)
        if: ${{ matrix.name == 'Linux x64 GNU' || matrix.name == 'Linux arm64 GNU' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            libssl-dev \
            pkg-config

      - name: Build Debug Binaries
        run: cargo build --locked --target ${{ matrix.target }} --bins

      - name: Assemble Debug Archive
        run: uv run --no-project scripts/package_release.py --target ${{ matrix.target }} --profile debug

      - name: Upload Debug Archive
        uses: actions/upload-artifact@v4
        with:
          name: quiver-debug-${{ matrix.target }}
          path: dist/*-${{ matrix.target }}-debug.txz
