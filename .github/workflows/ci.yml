name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            kind: desktop
            target: x86_64-pc-windows-msvc
            artifact: ci-build-windows-x64
            rust_targets: x86_64-pc-windows-msvc
            install_linux_deps: false
            install_dotnet: false

          - name: Windows arm64
            runner: windows-11-arm
            kind: desktop
            target: aarch64-pc-windows-msvc
            artifact: ci-build-windows-arm64
            rust_targets: aarch64-pc-windows-msvc
            install_linux_deps: false
            install_dotnet: false

          - name: macOS Intel
            runner: macos-26-intel
            kind: desktop
            target: x86_64-apple-darwin
            artifact: ci-build-macos-intel
            rust_targets: x86_64-apple-darwin
            install_linux_deps: false
            install_dotnet: true

          - name: macOS arm64
            runner: macos-26
            kind: desktop
            target: aarch64-apple-darwin
            artifact: ci-build-macos-arm64
            rust_targets: aarch64-apple-darwin
            install_linux_deps: false
            install_dotnet: true

          - name: Linux x64 GNU
            runner: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            artifact: ci-build-linux-x64-gnu
            rust_targets: x86_64-unknown-linux-gnu
            install_linux_deps: true
            install_dotnet: true

          - name: Linux arm64 GNU
            runner: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
            artifact: ci-build-linux-arm64-gnu
            rust_targets: aarch64-unknown-linux-gnu
            install_linux_deps: true
            install_dotnet: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux native system dependencies
        if: ${{ matrix.install_linux_deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget \
            xdg-utils

      - name: Install Rust toolchain and targets
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Install .NET SDK
        if: ${{ matrix.install_dotnet }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri desktop target
        shell: bash
        run: |
          bun tauri build \
            --debug \
            --target "${{ matrix.target }}" \
            --no-bundle \
            --verbose
