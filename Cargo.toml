[package]
name = "quiver"
version = "0.2.1"
description = "A terminal interface for yt-dlp"
authors = ["VinVel"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/VinVel/Quiver"
build = "src/build.rs"

[lints.clippy]
all = "warn"
pedantic = "warn"
significant_drop_tightening = "warn"
redundant_pub_crate = "warn"
redundant_clone = "warn"
needless_collect = "warn"
useless_let_if_seq = "warn"
equatable_if_let = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"
tempfile = "3"
ratatui-kit = { version = "0.12.0", features = ["virtual-list"] }
crossterm = "0.29"
tui-input = "0.15"
directories = "6"
clap = { version = "4", features = ["derive"] }
textwrap = "0.16"

[build-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[lib]
name = "quiver_lib"

[[bin]]
name = "quiver"
path = "src/main.rs"

[[bin]]
name = "quiver-yt-dlp"
path = "src/bin/quiver-yt-dlp.rs"

[[bin]]
name = "quiver-ytsubconverter"
path = "src/bin/quiver-ytsubconverter.rs"

[[bin]]
name = "quiver-deno"
path = "src/bin/quiver-deno.rs"

[[bin]]
name = "quiver-bgutil-pot"
path = "src/bin/quiver-bgutil-pot.rs"

[[bin]]
name = "quiver-ffmpeg"
path = "src/bin/quiver-ffmpeg.rs"

[[bin]]
name = "quiver-ffprobe"
path = "src/bin/quiver-ffprobe.rs"
